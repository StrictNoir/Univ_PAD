name: smart_proxy_app
services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    restart: no
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASSWORD=${RABBITMQ_PASS}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  server1:
    container_name: web_api_1
    image: web_api_image
    build:
      context: .
      dockerfile: Server/Dockerfile
    restart: no
    ports: 
      - "8080:8080"
    depends_on: 
      - mongo1
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MONGO_DB_NAME=EmployeeDb1
      - MONGO_HOST=mongo1
        
  server2:
    container_name: web_api_2
    image: web_api_image
    build:
      context: .
      dockerfile: Server/Dockerfile
    restart: no
    ports: 
      - "8081:8080"
    depends_on:
      - mongo2
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MONGO_DB_NAME=EmployeeDb2
      - MONGO_HOST=mongo2


  mongo1:
    container_name: mongo1
    image: mongo:latest
    restart: no
    ports:
      - "27017:27017"
    volumes:
      - mongo_data1:/data/db
      - mongo_config1:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=EmployeeDb1
      - MONGO_LOG_LEVEL=warning
  
  mongo2:
    container_name: mongo2
    image: mongo:latest
    restart: no
    ports:
      - "27018:27017"
    volumes:
      - mongo_data2:/data/db
      - mongo_config2:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=EmployeeDb2
      - MONGO_LOG_LEVEL=warning
volumes:
  mongo_data1:
  mongo_config1:
  mongo_data2:
  mongo_config2:
  rabbitmq_data:
      