syntax = "proto3";

option csharp_namespace = "Sender";

service Broker {
  rpc Ping (PingRequest) returns (PongReply);
  rpc Publish (PublishRequest) returns (PublishReply);
}

message PingRequest {}
message PongReply { string message = 1; }

message PublishRequest {
  string topic = 1;
  string title = 2;
  string content = 3;
}
message PublishReply { string status = 1; }
