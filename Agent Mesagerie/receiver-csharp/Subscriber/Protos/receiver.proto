syntax = "proto3";

option csharp_namespace = "Subscriber";

package Subscriber;



// Server response
message Envelope {
  string subject = 1;
  bytes payload = 2;
  map<string, string> headers = 3;
  string message_id = 4;
  int64 timestamp_ms = 5;
}

message Subscription{
	string subject = 1;
	string consumer_group = 2;
}

service Broker{
	rpc Subscribe (Subscription) returns (stream Envelope);
}