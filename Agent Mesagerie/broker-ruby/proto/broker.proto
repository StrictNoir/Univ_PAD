syntax = "proto3";

package broker.v1;

option ruby_package = "Broker::Proto";

message Envelope {
  string subject = 1;
  bytes payload = 2;
  map<string, string> headers = 3;
  string message_id = 4;
  int64 timestamp_ms = 5;
}

message PublishAck {
  string message_id = 1;
  bool accepted = 2;
  string detail = 3;
}

message Subscription {
  string subject = 1;
}

message AckRequest {
  string subject = 1;
  string message_id = 2;
}

message AckReply {
  bool acknowledged = 1;
}

service Broker {
  rpc Publish(Envelope) returns (PublishAck);
  rpc Subscribe(Subscription) returns (stream Envelope);
  rpc Ack(AckRequest) returns (AckReply);
}